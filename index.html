<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thông tin xuất hoá đơn</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container" role="main" aria-label="Form xuất hoá đơn VIOTUS">

    <div class="header-flex">
      <div class="character" aria-hidden="true" title="Xin chào, tôi là Lotasu-chan" style="position: relative;">
        <img src="lotuschan.png" alt="Lotuschan ở đây nè..."
             onerror="this.style.display='none'" id="lotuschan-img" />
        <div class="cloud-bubble" id="lotuschan-bubble">Xin chào, tôi là Lotuschan!</div>
      </div>
      <h1 class="title" aria-label="">Thông tin xuất hoá đơn</h1>
    </div>

    <!-- Chọn nhãn hàng -->
    <div class="form-group" aria-label="Chọn nhãn hàng">
      <div class="tag-number tag-01" aria-hidden="true" title="Số 1">01</div>
      <div class="input-with-icon">
        <select id="brandList" onchange="updateRestaurants()" aria-required="true" aria-describedby="desc-brand" aria-label="Chọn nhãn hàng">
          <option disabled selected>--- Chọn nhãn hàng ---</option>
        </select>
      </div>
    </div>

    <!-- Nhà hàng -->
    <div class="form-group" aria-label="Chọn nhà hàng">
      <div class="tag-number tag-02" aria-hidden="true" title="Số 2">02</div>
      <div class="input-with-icon">
        <select id="restaurantList" onchange="showInfo()" aria-required="true" aria-label="Chọn nhà hàng">
          <option disabled selected>--- Chọn nhà hàng ---</option>
        </select>
      </div>
    </div>

    <div class="decorative-line" aria-hidden="true"></div>

    <!-- Ghi chú -->
    <div class="form-group" aria-label="Ghi chú">
      <div class="tag-number tag-03" aria-hidden="true" title="Ghi chú icon hình trái tim màu hồng tím pastel">❤️</div>
      <div class="field-label">Ghi chú</div>
      <div class="input-with-icon" style="padding-left:14px;">
        <div id="note" class="clickable-info" style="min-height: 20px; padding: 10px 16px; flex-grow: 1;"></div>
      </div>
    </div>

    <!-- Mã số thuế -->
    <div class="form-group" aria-label="Mã số thuế">
      <div class="tag-number tag-04" aria-hidden="true" title="Mã số thuế icon hình ổ khóa vàng pastel">🔒</div>
      <div class="field-label">Mã số thuế</div>
      <div class="input-with-icon" style="padding-left:14px;">
        <div id="taxNumber" class="clickable-info" style="min-height: 20px; padding: 10px 16px; flex-grow: 1;"></div>
      </div>
    </div>

    <!-- Tên đơn vị -->
    <div class="form-group" aria-label="Tên đơn vị">
      <div class="tag-number tag-05" aria-hidden="true" title="Tên đơn vị icon hình tòa nhà màu hồng pastel">🏢</div>
      <div class="field-label">Tên đơn vị</div>
      <div class="input-with-icon" style="padding-left:14px;">
        <div id="name" class="clickable-info" style="min-height: 20px; padding: 10px 16px; flex-grow: 1;"></div>
      </div>
    </div>

    <!-- Địa chỉ -->
    <div class="form-group" aria-label="Địa chỉ">
      <div class="tag-number tag-06" aria-hidden="true" title="Địa chỉ icon hình bản đồ chỉ đường màu hồng pastel">📍</div>
      <div class="field-label">Địa chỉ</div>
      <div class="input-with-icon" style="padding-left:14px;">
        <div id="address" class="clickable-info" style="min-height: 20px; padding: 10px 16px; flex-grow: 1;"></div>
      </div>
    </div>

    <!-- Tên người mua hàng -->
    <div class="form-group" aria-label="Tên người mua hàng">
      <div class="tag-number tag-02" aria-hidden="true" title="Tên người mua hàng icon màu xanh pastel tròn">🏢</div>
      <div class="field-label">Tên người mua<br>hàng</div>
      <div class="input-with-icon" style="padding-left:14px;">
        <div id="nhname" class="clickable-info" style="min-height: 20px; padding: 10px 16px; flex-grow: 1;"></div>
      </div>
    </div>

    <!-- Copy icon bottom right -->
    <!-- <button type="button" id="copyButton" class="copy-icon" aria-label="Sao chép thông tin">
        <i class="fa-regular fa-copy" style="color: #f33fdb; font-size: 24px;"></i>
    </button> -->

    <button type="button" class="copy-icon" id="copyButton" aria-label="Sao chép thông tin">
        <img src="copy-writing.png" style="color: #f33fdb; font-size: 30px;" alt="Icon sao chép" />
    </button>

  </main>

  <!-- Sakura container -->
  <div id="sakura-container"></div>

  <!-- Copy success notification -->
  <span id="copy-success">Copied!</span>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
